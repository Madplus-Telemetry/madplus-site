name: Scan and publish

# Publish a GitHub Release in this repo with the signed APK attached
# (name it madplus-<version>.apk). This workflow then scans the APK with
# VirusTotal and MetaDefender and regenerates the download page.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan and publish
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download the APK from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dl

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          MD_API_KEY: ${{ secrets.MD_API_KEY }}
        run: node scripts/scan.mjs dl/*.apk "$TAG"

      - name: Render page
        run: node scripts/render-next.mjs

      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html release.json
          git commit -m "Publish $TAG" || echo "nothing to commit"
          git push origin HEAD:main
