name: Build preview

# Builds preview/index.html from release.json with scripts/render-next.mjs.
# The live page (index.html) is not touched.

on:
  push:
    branches: [main]
    paths:
      - scripts/render-next.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render preview
        run: node scripts/render-next.mjs --preview

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          git commit -m "Update preview" || echo "nothing to commit"
          git push origin HEAD:main
